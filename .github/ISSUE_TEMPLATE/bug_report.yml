name: Bug report
description: Report reproducible TreeWork behavior that does not match its contract.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest project state and exact steps that reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TreeWork version
      description: Output from `tw version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Codex version, Rust version, and Git version.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant errors, screenshots, or sanitized `.TreeWork/` state.
